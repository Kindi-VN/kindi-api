services:
  api:
    container_name: kindi-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.docker
        required: false
    ports:
      - "5000:80"
      - "5001:443"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    container_name: kindi-postgres
    image: postgres:16
    env_file:
      - path: .env.docker
        required: false
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrong!Passw0rd
      POSTGRES_DB: FlashOfferDb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FlashOfferDb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Seq — xem log tập trung khi chạy local: UI http://localhost:5341
  # API mặc định trỏ Serilog:Seq:ServerUrl vào đúng cổng này (xem appsettings.json).
  seq:
    container_name: kindi-seq
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      # Local không cần đăng nhập. Muốn bật xác thực thì bỏ dòng dưới và dùng 2 dòng bị chú thích:
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
      # SEQ_FIRSTRUN_ADMINUSERNAME: admin
      # SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?dat-mat-khau-trong-.env}
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
    driver: local
  seq-data:
    driver: local
